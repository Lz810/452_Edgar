<!DOCTYPE html>
<html>
<head>
    <title>文件上传</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .upload-section { margin-bottom: 20px; }
        .file-list { border-top: 1px solid #ddd; padding-top: 10px; }
    </style>
</head>
<body>
    <h1>Assignment Submission</h1>
    
    <!-- 上传表单 -->
    <form method="POST" enctype="multipart/form-data">
        {% for week in range(1, 9) %}
        <div class="upload-section">
            <label>Week {{ week }} (TXT file):</label>
            <input type="file" name="week{{ week }}" accept=".txt">
        </div>
        {% endfor %}
        <button type="submit">上传文件</button>
    </form>
    
    <!-- 显示文件列表 -->
    <div class="file-list">
        {% for week, files in week_files.items() %}
        <div>
            <h3>{{ week }} ({{ files|length }} files)</h3>
            <ul>
                {% for file in files %}
                <li>{{ file }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endfor %}
    </div>
</body>
</html>
