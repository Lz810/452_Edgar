<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 3</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .buttons {
            margin-bottom: 20px;
        }
        button {
            margin: 5px;
            padding: 5px 10px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 200px);
            gap: 10px;
        }
        .image {
            width: 200px;
            height: 150px;
            object-fit: cover;
        }
        .hide {
            display: none;
        }
    </style>
</head>
<body>
    <div class="buttons">
        <button onclick="filterImages('all')">All</button>
        <button onclick="filterImages('nature')">Nature</button>
        <button onclick="filterImages('city')">City</button>
        <button onclick="filterImages('animals')">Animals</button>
    </div>
    <div class="gallery">
        <img src="nature1.jpg" class="image nature" alt="Nature 1">
        <img src="nature2.jpg" class="image nature" alt="Nature 2">
        <img src="city1.jpg" class="image city" alt="City 1">
        <img src="city2.jpg" class="image city" alt="City 2">
        <img src="animal1.jpg" class="image animals" alt="Animal 1">
        <img src="animal2.jpg" class="image animals" alt="Animal 2">
    </div>
    <script src="script.js"></script>
</body>
</html>
