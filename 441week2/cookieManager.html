<!DOCTYPE html>
<html>
<head>
    <title>Cookie Manager</title>
    <meta charset="UTF-8">
    <style>
        .container {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .button-group {
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            margin-right: 10px;
            cursor: pointer;
        }
        #cookieValue {
            margin-top: 20px;
            padding: 10px;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Cookie Manager</h2>
        
        <div class="button-group">
            <button onclick="setCookie()">Set Cookie</button>
            <button onclick="readCookie()">Read Cookie</button>
            <button onclick="deleteCookie()">Delete Cookie</button>
        </div>

        <div id="cookieValue">Current Cookie Value: Not Read</div>
    </div>

    <script>
        function setCookie() {
            const userInput = prompt("Please enter your name:");
            if (userInput != null && userInput.trim() !== "") {
                // Set cookie with 1 day expiration
                const d = new Date();
                d.setTime(d.getTime() + (24*60*60*1000));
                const expires = "expires=" + d.toUTCString();
                document.cookie = "userName=" + userInput + ";" + expires + ";path=/";
                alert('Cookie has been set!');
                readCookie(); // Automatically update the display
            }
        }

        function readCookie() {
            const cookies = document.cookie.split(';');
            let userName = "Not Found";
            
            for(let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.startsWith("userName=")) {
                    userName = cookie.substring("userName=".length, cookie.length);
                    break;
                }
            }
            
            document.getElementById("cookieValue").innerHTML = 
                "Current Cookie Value: " + userName;
        }

        function deleteCookie() {
            document.cookie = "userName=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
            alert('Cookie has been deleted!');
            readCookie(); // Automatically update the display
        }
    </script>
</body>
</html>
