<!DOCTYPE html>
<html>
<head>
    <title>Form Data Display</title>
    <meta charset="UTF-8">
    <style>
        .container {
            margin: 20px;
            padding: 20px;
            max-width: 500px;
            font-family: Arial, sans-serif;
        }
        .data-display {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .data-item {
            margin: 10px 0;
        }
        .label {
            font-weight: bold;
        }
        .back-button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Submitted Information</h2>
        <div class="data-display" id="dataDisplay">
            <!-- Data will be displayed here -->
        </div>
        <a href="form.html" class="back-button">Back to Form</a>
    </div>

    <script>
        window.onload = function() {
            // Get URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name');
            const email = urlParams.get('email');
            const phone = urlParams.get('phone');

            // Create HTML content
            let html = '';
            if (name) {
                html += '<div class="data-item"><span class="label">Name:</span> ' + name + '</div>';
            }
            if (email) {
                html += '<div class="data-item"><span class="label">Email:</span> ' + email + '</div>';
            }
            if (phone) {
                html += '<div class="data-item"><span class="label">Phone:</span> ' + phone + '</div>';
            }

            // Display the data
            document.getElementById('dataDisplay').innerHTML = html || 'No data submitted';
        }
    </script>
</body>
</html>
