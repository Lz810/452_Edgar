                name: "Advanced Diploma of Information Technology",
                description: "This qualification provides the skills and knowledge for an individual to administer and manage information and communications technology (ICT) support in small-to-medium enterprises (SMEs).",
                duration: "24 months",
                image: "course4.jpg",
                resources: [
                    {
                        id: "R007",

            {

                name: "Graduate Certificate in Information Technology",
                description: "This qualification provides the skills and knowledge for an individual to administer and manage information and communications technology (ICT) support in small-to-medium enterprises (SMEs).",
                duration: "12 months",

                resources: [

        // Display resources
        function showResources() {
            // Get course ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const courseId = urlParams.get('courseId');
            
            const course = courses.find(c => c.id === courseId);
            const resourcesContainer = document.getElementById('resources-container');
            const courseTitle = document.getElementById('course-title');
            
            if (!course) {
                courseTitle.textContent = 'Training Resources';
                resourcesContainer.innerHTML = '<p>Course not found.</p>';
                return;
            }

            courseTitle.textContent = `Training Resources - ${course.name}`;
            
            resourcesContainer.innerHTML = `
                <div class="course-info">
                    <h3>${course.name}</h3>
                    <p>${course.description}</p>
                    <p>Duration: ${course.duration}</p>
                </div>
                <div class="resources-grid">
                    ${course.resources.map(resource => `
                        <div class="resource-card">
                            <h4>${resource.name}</h4>
                            <p>${resource.description}</p>
                            <p class="resource-price">Price: $${resource.price}</p>
                            <button onclick="addToCart('${resource.id}')" class="add-to-cart-button">
                                Add to Cart
                            </button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Add to cart
        function addToCart(resourceId) {
            const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
            if (!currentUser) {
                alert('Please login first');
                window.location.href = 'login.html';
                return;
            }

            // 从URL获取课程ID
            const urlParams = new URLSearchParams(window.location.search);
            const courseId = urlParams.get('courseId');
            const course = courses.find(c => c.id === courseId);
            const resource = course.resources.find(r => r.id === resourceId);

            if (!resource) {
                alert('Resource not found');
                return;
            }

            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const existingItem = cart.find(item => item.id === resourceId);

            if (existingItem) {
                existingItem.quantity = (existingItem.quantity || 1) + 1;
            } else {
                cart.push({
                    id: resource.id,
                    name: resource.name,
                    description: resource.description,
                    price: `¥${resource.price}`,
                    quantity: 1
                });
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            alert('Added to cart');
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', showResources);
    </script>
</body>
