<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - NeoTech Wave RTO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a id="auth-link" href="login.html">Log/Sign in</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="orders-section">
            <h2>Welcome, <span id="username"></span></h2>
            <div class="orders-actions">
                <button onclick="downloadOrders()" class="download-button">Download Order History</button>
            </div>
            <div class="orders-container" id="orders-container">
                <!-- Orders will be dynamically added here -->
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2024 NeoTech Wave RTO. All rights reserved.</p>
            <p>RTO Provider Number: [Your RTO Number]</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Check login status and redirect if not logged in
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        // Format price consistently
        function formatPrice(price) {
            if (!price) return '0.00';
            const cleaned = price.toString()
                .replace(/价格[:：]\s*/g, '')
                .replace(/¥/g, '')
                .replace(/[^\d.]/g, '');
            return parseFloat(cleaned || '0').toFixed(2);
        }

        // Format quantity consistently
        function formatQuantity(quantity) {
            if (!quantity) return '1';
            return quantity.toString()
                .replace(/数量[:：]\s*/g, '')
                .replace(/[^\d]/g, '') || '1';
        }

        // Display orders for current user
        function displayOrders() {
            // 重新获取 currentUser，以确保使用最新的用户信息
            const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            // 显示用户名
            document.getElementById('username').textContent = currentUser.username;

            // 获取并过滤订单
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            console.log('All orders:', orders); // 调试用
            console.log('Current user:', currentUser); // 调试用
            
            // 清理和验证订单数据
            const validOrders = orders.filter(order => {
                // 检查订单结构
                if (!order || typeof order !== 'object') {
                    console.log('Invalid order (not an object):', order);
                    return false;
                }
                
                // 检查必要字段
                if (!order.username || !order.orderId || !order.products) {
                    console.log('Order missing required fields:', order);
                    return false;
                }

                // 检查用户名匹配
                const isMatch = order.username === currentUser.username;
                console.log(`Order ${order.orderId} - username: ${order.username}, current: ${currentUser.username}, match: ${isMatch}`);
                return isMatch;
            });
            
            console.log('Valid filtered orders:', validOrders); // 调试用

            const ordersContainer = document.getElementById('orders-container');
            if (validOrders.length === 0) {
                ordersContainer.innerHTML = '<p>No order history</p>';
                return;
            }

            // 按日期排序（最新的在前面）
            validOrders.sort((a, b) => new Date(b.date) - new Date(a.date));

            // 显示订单
            ordersContainer.innerHTML = validOrders.map(order => {
                // 计算订单总额
                const orderTotal = order.products.reduce((sum, product) => {
                    const price = parseFloat(formatPrice(product.price));
                    const quantity = parseInt(formatQuantity(product.quantity));
                    return sum + (price * quantity);
                }, 0);

                return `
                    <div class="order-card">
                        <h4>Order ID: ${order.orderId}</h4>
                        <p>Date: ${new Date(order.date).toLocaleDateString()}</p>
                        <p>Total: ¥${orderTotal.toFixed(2)}</p>
                        <div class="order-items">
                            ${order.products.map(product => `
                                <div class="order-item">
                                    <h5>${product.name}</h5>
                                    <p>${product.description || ''}</p>
                                    <p>Price: ¥${formatPrice(product.price)}</p>
                                    <p>Quantity: ${formatQuantity(product.quantity)}</p>
                                    <p>Subtotal: ¥${(parseFloat(formatPrice(product.price)) * parseInt(formatQuantity(product.quantity))).toFixed(2)}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Download orders
        function downloadOrders() {
            const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
            if (!currentUser) {
                alert('Please login first');
                window.location.href = 'login.html';
                return;
            }

            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            const userOrders = orders.filter(order => order.username === currentUser.username);

            if (userOrders.length === 0) {
                alert('No order history available for download');
                return;
            }

            let csvContent = "Order ID,Date,Product Name,Quantity,Price,Total\n";

            userOrders.forEach(order => {
                order.products.forEach(product => {
                    const price = parseFloat(formatPrice(product.price));
                    const quantity = parseInt(formatQuantity(product.quantity));
                    const total = price * quantity;
                    const date = new Date(order.date).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    });
                    
                    csvContent += `${order.orderId},${date},${product.name},${quantity},${price},${total}\n`;
                });
            });

            try {
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `orders_${currentUser.username}_${new Date().toISOString().split('T')[0]}.csv`;
                
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error('Error during download:', error);
                alert('Download failed: ' + error.message);
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            displayOrders();
        });
    </script>
</body>

</html>
